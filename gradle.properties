# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric toolchain - every version the mod is pinned to lives here, and nowhere else.
# Checked against meta.fabricmc.net and maven.fabricmc.net, not copied from a tutorial.
#
# Heads-up: Yarn mappings stop at 1.21.11. Moving to a later game version (26.x)
# means switching to official Mojang mappings and renaming the imports.
# See DECISIONS.md.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
fabric_version=0.141.6+1.21.11
loom_version=1.17.21

# Mod
mod_version=0.1.0
maven_group=fr.clixmods.mcsc
archives_base_name=mcskincreator
