name: build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:

# No secret is needed to build the mod, so none is granted here.
# Publishing tokens will be added with the release workflow, not before.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Minecraft 1.21.11 runs on Java 21. This has to match the toolchain
          # pinned in build.gradle.
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mcskincreator-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
