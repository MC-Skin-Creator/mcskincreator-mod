name: release

# Merging is what cuts a release: main produces a stable one, develop a
# pre-release. Tags are created here rather than being the trigger. Doc-only
# changes are excluded: develop builds unconditionally otherwise, and a jar
# carries no doc content worth a pre-release.
on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release, e.g. 1.0.0. Leave empty to derive it from the commits.'
        required: false
        type: string

permissions:
  contents: write
  # The texture engine is read from GitHub Packages, which asks for a token even for
  # a public package. Every jar of a release embeds it through Jar-in-Jar.
  packages: read

# Two merges in a row must not compute the same number at once. A key can only
# appear once at the top level, so this is the only concurrency block: nothing is
# cancelled, because a stable release may be halfway through tagging and pushing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Not a secret: the id is public. The token is, and lives in the repository secrets.
  MODRINTH_ID: pYSOnbJQ
  CURSEFORGE_ID: 1718964

# Four jobs, so the slow part runs in parallel: one runner building every target in
# turn took over an hour, each preparing its own Minecraft and loader. The version
# is worked out once, every target builds on its own runner as on a pull request,
# and the release and the uploads only start once every jar exists - a target that
# fails to build stops the release before anything is tagged.
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout
        # Full history and tags: the version is derived from the commits since the
        # last stable tag.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [ "${{ github.ref_name }}" = 'develop' ]; then
            # Every merge into develop gets a build, even one carrying no
            # release-worthy commit. The -dev. suffix sorts below the release it
            # previews, which is exactly what it is.
            base=$(.github/scripts/next-version.sh --min-patch)
            version="${base}-dev.${RUN_NUMBER}"
            channel=dev
          elif [ -n "$MANUAL_VERSION" ]; then
            # The manual path exists for the versions no commit message should
            # decide on its own - 1.0.0 above all.
            version="$MANUAL_VERSION"
            channel=stable
          else
            version=$(.github/scripts/next-version.sh)
            channel=stable
          fi

          if [ -z "$version" ]; then
            echo 'No commit since the last tag earns a release. Nothing to do.'
            echo 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} already exists. Nothing to do."
            echo 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Releasing v${version} (${channel})"
          {
            echo 'release=true'
            echo "version=${version}"
            echo "channel=${channel}"
          } >> "$GITHUB_OUTPUT"

      - name: List the targets
        # Read from stonecutter.properties.toml, one entry per table, so a target
        # added there is built and published without this file changing.
        id: targets
        run: echo "targets=$(python3 .github/scripts/release-targets.py)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      matrix:
        target: ${{ fromJSON(needs.version.outputs.targets) }}
    name: build ${{ matrix.target.node }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Minecraft up to 1.20.4 runs on Java 17, then Java 21, and 26.x on Java 25.
          # The last entry becomes JAVA_HOME and so runs Gradle itself.
          java-version: |
            17
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Off the default branch the cache is read-only by default, so develop
          # would never populate it.
          cache-read-only: false
          # Drops what the build did not use before the cache is saved, failed
          # builds included.
          cache-cleanup: always

      - name: Stamp the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # stonecutter.properties.toml is the single source of the mod version, and
          # it wins over -P properties on the command line - verified, not assumed.
          sed -i "s/^mod\.version = .*/mod.version = \"${VERSION}\"/" stonecutter.properties.toml
          grep '^mod.version' stonecutter.properties.toml

      - name: Build
        # The tests already ran on the pull request; this only builds the jar.
        # --configure-on-demand configures this one target and the root alone, the
        # same as on a pull request.
        run: >-
          ./gradlew ":${{ matrix.target.node }}:buildAndCollect"
          --stacktrace --configure-on-demand
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
          -Pgpr.user=${{ github.actor }} -Pgpr.token=${{ secrets.GITHUB_TOKEN }}

      - name: Hand the jar to the release
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target.node }}
          path: build/libs/*/*.jar
          if-no-files-found: error
          # The release attaches it; the artifact itself is only the hand-over.
          retention-days: 1

  release:
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect the jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: jars
          merge-multiple: true

      - name: Record the version on main
        # Only stable releases write the number back, so the file on main always
        # states the version that was actually released. A push made with
        # GITHUB_TOKEN does not start another workflow run, so this cannot loop.
        if: needs.version.outputs.channel == 'stable'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^mod\.version = .*/mod.version = \"${VERSION}\"/" stonecutter.properties.toml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stonecutter.properties.toml
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "v${VERSION}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -euo pipefail

          args=(--generate-notes --title "v${VERSION}")

          # Below 1.0.0 the mod is in beta: say so, and keep it off GitHub's
          # "Latest" badge. 1.0.0 is the day this stops applying.
          if [ "$CHANNEL" = 'stable' ] && [[ $VERSION == 0.* ]]; then
            args=(--generate-notes --title "v${VERSION} (beta)" --prerelease)
          fi

          if [ "$CHANNEL" = 'dev' ]; then
            # Marked as a pre-release so it never displays as the latest version.
            args+=(--prerelease --target "${{ github.sha }}")

            # Generate the notes from the last stable release, so a dev build lists
            # what it adds over the last thing that shipped rather than over the
            # previous dev build. Skipped while no stable release exists: passing an
            # empty --notes-start-tag fails the command.
            # || true because grep exits 1 when there is no tag at all, and under
            # pipefail that would kill the step before gh is ever reached.
            last_stable=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-dev\.' | head -n 1 || true)
            if [ -n "$last_stable" ]; then
              args+=(--notes-start-tag "$last_stable")
            fi
          fi

          # Wherever the artifacts unpacked them: one jar per target.
          mapfile -t jars < <(find jars -name '*.jar' | sort)
          echo "${#jars[@]} jars"
          gh release create "v${VERSION}" "${args[@]}" "${jars[@]}"

  # Stable releases only: the -dev builds are untested previews and stay on GitHub.
  # One Modrinth and CurseForge version per jar, every target included, each marked
  # with the game releases its TOML table lists and with its release type there -
  # alpha until it has run in a real game on its loader. Skipped, not failed, while
  # neither the MODRINTH_TOKEN nor the CURSEFORGE_TOKEN secret exists.
  publish:
    needs: [version, release]
    if: needs.version.outputs.channel == 'stable'
    strategy:
      # Kept low so the two platforms' rate limits are never the reason a step fails.
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.version.outputs.targets) }}
    name: publish ${{ matrix.target.node }}
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    steps:
      - name: Fetch the jar
        if: env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.target.node }}
          path: jar

      - name: Name the version
        # The jar's own name carries the version string, the game version it was
        # built on and the loader: mcskincreator-0.2.0+mc1.20.1-forge.jar.
        if: env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != ''
        id: name
        env:
          LOADER: ${{ matrix.target.loader }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          jar=$(find jar -name '*.jar')
          full=$(basename "$jar" .jar)
          full=${full#mcskincreator-}
          game=${full#*+mc}
          game=${game%-"$LOADER"}
          case "$LOADER" in
            fabric) label="$game" ;;
            quilt) label="Quilt $game" ;;
            neoforge) label="NeoForge $game" ;;
            forge) label="Forge $game" ;;
          esac
          {
            echo "jar=${jar}"
            echo "version=${full}"
            echo "label=${label}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth and CurseForge
        if: env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: ${{ steps.name.outputs.jar }}
          name: MC Skin Creator ${{ needs.version.outputs.version }} (${{ steps.name.outputs.label }})
          version: ${{ steps.name.outputs.version }}
          version-type: ${{ matrix.target.type }}
          loaders: ${{ matrix.target.loader }}
          game-versions: ${{ matrix.target.releases }}
          # Only the Fabric jars ask for another mod: the Quilt ones ask for Quilt
          # Loader alone, and NeoForge and Forge for nothing.
          dependencies: ${{ matrix.target.loader == 'fabric' && 'fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}' || '' }}
          changelog: |
            See the full notes on GitHub: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.version.outputs.version }}
