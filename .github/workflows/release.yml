      - name: Publish to Modrinth and CurseForge (Forge 26.2)
        if: steps.version.outputs.release == 'true' && steps.version.outputs.channel == 'stable' && (env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != '')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
