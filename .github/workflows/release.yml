      # Run in a real game on NeoForge 26.3. NeoForge itself is still a beta on 26.3.
      - name: Publish to Modrinth and CurseForge (NeoForge 26.3)
        if: steps.version.outputs.release == 'true' && steps.version.outputs.channel == 'stable' && (env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != '')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
