          loaders: neoforge
          game-versions: 26.3
          changelog: |
            See the full notes on GitHub: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}

      # Quilt: one version per Minecraft version as well, from the -quilt jars, which
