          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: build/libs/${{ steps.version.outputs.version }}/*+mc1.21.11-neoforge.jar
          name: MC Skin Creator ${{ steps.version.outputs.version }} (NeoForge 1.21.11)
          version: ${{ steps.version.outputs.version }}+mc1.21.11-neoforge
