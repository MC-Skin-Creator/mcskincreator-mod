          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: build/libs/${{ steps.version.outputs.version }}/*+mc26.3-neoforge.jar
          name: MC Skin Creator ${{ steps.version.outputs.version }} (NeoForge 26.3)
          version: ${{ steps.version.outputs.version }}+mc26.3-neoforge
