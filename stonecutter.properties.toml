# Centralized configuration: mod identity at the top, then one table per Minecraft
# target. This is the only file to touch when adding a version or bumping a
# per-version dependency.

mod.id = "mcskincreator"
mod.name = "MC Skin Creator"
mod.group = "fr.clixmods.mcsc"
mod.version = "0.1.0"

deps.fabric_loader = "0.19.3"

# The lowest Quilt Loader the Quilt jars are built and declared against: 0.30 is the
# first that treats every game version after 25 as unobfuscated, which the 26.x
# targets need.
deps.quilt_loader = "0.30.1"

# One JUnit line serves every target: the 5.14 line runs on Java 21 and on Java 25
# alike, so neither table below has to carry its own. The version pins the engine,
# the parameterised runner and the launcher together, through the JUnit BOM.
deps.junit = "5.14.4"

# The texture engine, shared with the site: fr.clixmods.mcsc:mcsc-engine turns a
# layer stack into the 64x64 sheet, and is the same Java the server runs, so the two
# cannot drift. One line for every target, like JUnit: it is plain Java 21 with an
# empty dependency tree, which is what lets it ride inside the mod jar.
deps.mcsc_engine = "0.1.0"

# Loom variant version used by loom-back-compat. The 1.17 line serves both the
# obfuscated (pre-26) and unobfuscated (26+) variants; the 1.18 line refuses to run
# below a Java 25 JVM, which would force Java 25 on every target including 1.21.11.
loomx.loom_version = "1.17-SNAPSHOT"

["1.21.10"]
mod.mc_compat = "1.21.10"
mod.mc_releases = ["1.21.10"]

deps.fabric_api = "0.138.4+1.21.10"

["1.21.11"]
# Compatibility range written into fabric.mod.json
mod.mc_compat = "1.21.11"
# Releases to mark compatible when publishing
mod.mc_releases = ["1.21.11"]

deps.fabric_api = "0.141.6+1.21.11"

["26.1.x"]
mod.mc_compat = "~26.1"
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]

deps.fabric_api = "0.155.3+26.1.2"

["26.2.x"]
mod.mc_compat = "~26.2"
mod.mc_releases = ["26.2"]

deps.fabric_api = "0.160.0+26.2"

["26.3.x"]
mod.mc_compat = "~26.3"
mod.mc_releases = ["26.3"]

deps.fabric_api = "0.161.0+26.3"

# NeoForge targets: the same game versions, built by ModDevGradle. mod.mc_compat and
# deps.neoforge_compat are Maven version ranges here, the syntax neoforge.mods.toml
# reads, where Fabric's tables above use Fabric's own.

["1.21.10-neoforge"]
mod.mc_compat = "[1.21.10]"
mod.mc_releases = ["1.21.10"]

deps.neoforge = "21.10.64"
deps.neoforge_compat = "[21.10.64,)"

["1.21.11-neoforge"]
mod.mc_compat = "[1.21.11]"
mod.mc_releases = ["1.21.11"]

deps.neoforge = "21.11.45"
deps.neoforge_compat = "[21.11.45,)"

["26.1.x-neoforge"]
mod.mc_compat = "[26.1,26.2)"
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]

deps.neoforge = "26.1.2.112"
deps.neoforge_compat = "[26.1.2.112,)"

["26.2.x-neoforge"]
mod.mc_compat = "[26.2,26.3)"
mod.mc_releases = ["26.2"]

deps.neoforge = "26.2.0.88"
deps.neoforge_compat = "[26.2.0.88,)"

["26.3.x-neoforge"]
# NeoForge has no stable 26.3 build yet; this is its latest beta.
mod.mc_compat = "[26.3,26.4)"
mod.mc_releases = ["26.3"]

deps.neoforge = "26.3.0.36-beta"
deps.neoforge_compat = "[26.3.0.36-beta,)"

# Quilt targets: the same game versions, built by Quilt Loom. mod.mc_compat uses
# quilt.mod.json's syntax, where "=" is exact and "~26.1" is the whole 26.1 line.
#
# loom-back-compat puts a Loom on every node's build classpath before its script
# runs. These three lines make that Loom Quilt's on the Quilt nodes: Quilt Loom keeps
# Fabric Loom's package names, so the two cannot sit on one classpath. Both plugin
# lines name the plugin's marker, the only coordinate Quilt publishes;
# build.quilt.gradle.kts then picks the remapping or the unobfuscated variant from
# the same jar.

["1.21.10-quilt"]
mod.mc_compat = "=1.21.10"
mod.mc_releases = ["1.21.10"]

loomx.loom_version = "1.15.1"
loomx.loom_remap_plugin = "org.quiltmc.loom"
loomx.loom_unobf_plugin = "org.quiltmc.loom"

["1.21.11-quilt"]
mod.mc_compat = "=1.21.11"
mod.mc_releases = ["1.21.11"]

loomx.loom_version = "1.15.1"
loomx.loom_remap_plugin = "org.quiltmc.loom"
loomx.loom_unobf_plugin = "org.quiltmc.loom"

["26.1.x-quilt"]
mod.mc_compat = "~26.1"
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]

loomx.loom_version = "1.15.1"
loomx.loom_remap_plugin = "org.quiltmc.loom"
loomx.loom_unobf_plugin = "org.quiltmc.loom"

["26.2.x-quilt"]
mod.mc_compat = "~26.2"
mod.mc_releases = ["26.2"]

loomx.loom_version = "1.15.1"
loomx.loom_remap_plugin = "org.quiltmc.loom"
loomx.loom_unobf_plugin = "org.quiltmc.loom"

["26.3.x-quilt"]
mod.mc_compat = "~26.3"
mod.mc_releases = ["26.3"]

loomx.loom_version = "1.15.1"
loomx.loom_remap_plugin = "org.quiltmc.loom"
loomx.loom_unobf_plugin = "org.quiltmc.loom"
