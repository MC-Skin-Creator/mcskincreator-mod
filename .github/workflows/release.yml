name: release

# Merging is what cuts a release. develop cuts a numbered beta on every merge that
# earns one (feat: -> minor, fix:/perf: -> patch), so the version follows the
# features by itself. main only cuts the stable releases, by hand, through the
# dispatch input: 1.0.0 is the day the beta ends. Tags are created here rather
# than being the trigger. Doc-only changes are excluded: a jar carries no doc
# content worth a release.
on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release, e.g. 1.0.0. Leave empty to derive it from the commits.'
        required: false
        type: string

permissions:
  contents: write

# Two merges in a row must not compute the same number at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Full history and tags: the version is derived from the commits since the
        # last stable tag.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${{ github.ref_name }}" = 'develop' ]; then
            # A real version, not a build counter: each merge that earns one gets
            # the next number, and nothing is cut for refactor/chore/docs/test.
            version=$(.github/scripts/next-version.sh)
            channel=beta
          elif [ -n "$MANUAL_VERSION" ]; then
            # The manual path exists for the versions no commit message should
            # decide on its own - 1.0.0 above all.
            version="$MANUAL_VERSION"
            channel=stable
          else
            version=$(.github/scripts/next-version.sh)
            channel=stable
          fi

          if [ -z "$version" ]; then
            echo 'No commit since the last tag earns a release. Nothing to do.'
            echo 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} already exists. Nothing to do."
            echo 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Releasing v${version} (${channel})"
          {
            echo 'release=true'
            echo "version=${version}"
            echo "channel=${channel}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDKs
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Set up Gradle
        if: steps.version.outputs.release == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Stamp the version
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # stonecutter.properties.toml is the single source of the mod version, and
          # it wins over -P properties on the command line - verified, not assumed.
          sed -i "s/^mod\.version = .*/mod.version = \"${VERSION}\"/" stonecutter.properties.toml
          grep '^mod.version' stonecutter.properties.toml

      - name: Build every Minecraft target
        if: steps.version.outputs.release == 'true'
        run: >-
          ./gradlew buildAndCollect --stacktrace
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Record the version on main
        # Only stable releases write the number back, so the file on main always
        # states the version that was actually released. A push made with
        # GITHUB_TOKEN does not start another workflow run, so this cannot loop.
        if: steps.version.outputs.release == 'true' && steps.version.outputs.channel == 'stable'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stonecutter.properties.toml
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "v${VERSION}"

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail

          args=(--generate-notes --title "v${VERSION}")

          if [ "$CHANNEL" = 'beta' ]; then
            # A pre-release never displays as the latest version, and the title
            # says what it is. Tagged on the exact commit that earned it.
            args=(--generate-notes --title "v${VERSION} (beta)" --prerelease --target "${{ github.sha }}")
          fi

          gh release create "v${VERSION}" "${args[@]}" build/libs/"${VERSION}"/*.jar
