          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: build/libs/${{ steps.version.outputs.version }}/*+mc1.21.10-neoforge.jar
          name: MC Skin Creator ${{ steps.version.outputs.version }} (NeoForge 1.21.10)
          version: ${{ steps.version.outputs.version }}+mc1.21.10-neoforge
