name: build

# main and develop are deliberately absent: the release workflow compiles every
# target on those branches seconds later, on the same commit. A compile check is
# worth running where it can still stop something - before a merge.
on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
  pull_request:

# Compiles every Minecraft target and attaches the resulting jars as a
# short-lived workflow artifact, so a PR can be test-installed before it merges.
# These are not releases: no tag, no GitHub release, no version bump.
# No secret is needed, so none is granted.
permissions:
  contents: read

jobs:
  build:
    # One job per Stonecutter target: a version that stops compiling fails the run
    # on its own line instead of hiding behind whichever version happens to be active.
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.21.11'
          - '26.2.x'

    name: build ${{ matrix.minecraft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Both are needed: Minecraft 1.21.11 runs on Java 21, 26.x on Java 25.
          # The last entry becomes JAVA_HOME and so runs Gradle itself.
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        # Points Gradle at the JDK installed above rather than downloading another one.
        # buildAndCollect compiles the same as build and additionally copies the jar
        # to build/libs/<mod version>/, which is what gets uploaded below.
        run: >-
          ./gradlew ":${{ matrix.minecraft }}:buildAndCollect" --stacktrace
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mcskincreator-${{ matrix.minecraft }}
          path: build/libs/*/*.jar
          # A preview build, not a release: no need to keep it around.
          retention-days: 7
